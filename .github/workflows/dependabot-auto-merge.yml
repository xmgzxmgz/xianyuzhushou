name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: dependabot-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge non-major updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -uo pipefail
          echo "update-type: ${{ steps.meta.outputs.update-type }}"

          count=0
          if out=$(gh pr view "$PR_URL" --json statusCheckRollup -q '[.statusCheckRollup[]?] | length' 2>/dev/null); then
            count="${out:-0}"
          else
            echo "读取检查状态失败（权限或分支限制），按无 CI 处理"
            count=0
          fi
          echo "status checks: $count"

          merge_pr() {
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              echo "已合并并删除分支"
            else
              echo "本次合并未成功（基线已变更或有冲突），Dependabot 下次 rebase 后自动重试"
            fi
          }

          if [ "$count" = "0" ]; then
            echo "无 CI 检查，直接合并"
            merge_pr
          elif gh pr checks "$PR_URL" --watch --fail-fast --interval 20 2>/dev/null; then
            echo "CI 全部通过，合并"
            merge_pr
          else
            echo "CI 未通过或状态不可读，保留 PR 等待人工处理"
          fi

          exit 0
