name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge non-major updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -uo pipefail
          echo "update-type: ${{ steps.meta.outputs.update-type }}"
          count=$(gh pr view "$PR_URL" --json statusCheckRollup -q '[.statusCheckRollup[]?] | length')
          echo "status checks: $count"
          if [ "$count" = "0" ]; then
            echo "无 CI 检查，直接合并"
            gh pr merge --squash --delete-branch "$PR_URL"
          elif gh pr checks "$PR_URL" --watch --fail-fast --interval 20; then
            echo "检查全部通过，合并"
            gh pr merge --squash --delete-branch "$PR_URL"
          else
            echo "检查未通过，保留 PR 等待人工处理"
          fi
